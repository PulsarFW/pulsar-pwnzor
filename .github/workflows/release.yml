name: Create release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Bundle files
        run: |
          mkdir -p ./temp/pulsar-pwnzor
          cp ./{README.md,fxmanifest.lua,cl_config.lua,sv_config.lua} ./temp/pulsar-pwnzor
          cp -r ./{client,server} ./temp/pulsar-pwnzor
          cd ./temp && zip -r ../pulsar-pwnzor.zip ./pulsar-pwnzor

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "PULSAR-PWNZOR ${{ github.ref_name }}"
          body: |
            ![Pulsar Framework](https://r2.fivemanage.com/GPYOH8Hq4GPyAY7czrgLe/pulsarbanner.png)

            ## PULSAR-PWNZOR ${{ github.ref_name }}

            Anti-cheat and exploit detection system for Pulsar Framework.

            ### Installation
            1. Download `pulsar-pwnzor.zip` below
            2. Extract into your server's `resources` folder
            3. Add `ensure pulsar-pwnzor` to your `server.cfg`

            ---
            ![Pulsar Framework](https://img.shields.io/badge/Pulsar-Framework-7c3aed?style=flat-square)
            ![Built for FiveM](https://img.shields.io/badge/Built_for-FiveM-F40552?style=flat-square)
          files: pulsar-pwnzor.zip
          prerelease: false
